name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node and pnpm come from mise.toml. The action trusts the checkout
      # (MISE_TRUSTED_CONFIG_PATHS) and caches the tools it installs.
      - uses: jdx/mise-action@v4

      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=$store" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec gql.tada check
      - run: pnpm format:check
